<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ashwin FC | Official Club Website</title>
    <!-- Google Fonts for Professional Look -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #0d1b2a;
            --secondary: #1b263b;
            --accent: #e63946;
            --gold: #ffb703;
            --text-light: #f8f9fa;
            --text-dark: #212529;
            --gray-bg: #f1f3f5;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Roboto', sans-serif;
        }

        body {
            background-color: var(--gray-bg);
            color: var(--text-dark);
        }

        /* Top Bar */
        .top-bar {
            background-color: #000;
            color: var(--gold);
            font-size: 0.8rem;
            text-align: center;
            padding: 6px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        /* Header & Nav */
        header {
            background-color: var(--primary);
            color: white;
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .crest {
            width: 50px;
            height: 50px;
            background: var(--gold);
            border: 3px solid var(--accent);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            color: var(--primary);
            font-family: 'Montserrat', sans-serif;
            font-size: 1.2rem;
            box-shadow: 0 0 10px rgba(255,183,3,0.5);
        }

        .club-name {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.5rem;
            font-weight: 900;
            letter-spacing: 1px;
            color: var(--text-light);
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 20px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.9rem;
            text-transform: uppercase;
            transition: color 0.3s;
        }

        nav a:hover {
            color: var(--gold);
        }

        /* Hero Banner */
        .hero {
            background: linear-gradient(rgba(13, 27, 42, 0.85), rgba(13, 27, 42, 0.85)), 
                        url('https://images.unsplash.com/photo-1508098682722-e99c43a406b2?auto=format&fit=crop&w=1350&q=80');
            background-size: cover;
            background-position: center;
            color: white;
            padding: 80px 5%;
            text-align: center;
        }

        .hero-tag {
            background-color: var(--accent);
            color: white;
            padding: 5px 15px;
            font-weight: bold;
            font-size: 0.8rem;
            text-transform: uppercase;
            border-radius: 3px;
            display: inline-block;
            margin-bottom: 15px;
        }

        .hero h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 3rem;
            font-weight: 900;
            margin-bottom: 15px;
            text-transform: uppercase;
        }
